function avatarHTML(name, photo, cls = 'w-10 h-10 text-sm') {

function timeAgo(ts) {
  if (!ts) return "الآن";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('ar', { dateStyle: 'medium', timeStyle: 'short' });
}

function followBtn(id) {

}

function compressImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function withTimeout(promise, ms = 15000) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error("انتهت المهلة، تحقق من الاتصال أو من قواعد Firestore")), ms))
  ]);
}

}

function postCard(p) {
  return `

        <span class="text-xs text-gray-500">${timeAgo(p.createdAt)}</span>
      </div>
      ${p.userId === uid() ? `<button data-act="delpost" data-id="${p.id}" class="text-gray-500 px-2"><i class="fa-solid fa-trash"></i></button>` : ''}
    </div>
    ${p.text ? `<p class="px-3 pb-3 text-sm whitespace-pre-wrap">${esc(p.text)}</p>` : ''}
    ${p.image ? `<img src="${esc(p.image)}" class="w-full max-h-[480px] object-cover">` : ''}
    ${actionsHTML(p)}
    <div id="cbox-${p.id}" class="hidden p-3 border-t border-gray-800 space-y-2"></div>
  </article>`;
}

function renderPosts(containerId, filter, emptyMsg) {
  const box = $(containerId);
  if (!box) return;
  const list = Object.entries(postsCache)
    .map(([id, p]) => ({ id, ...p }))
    .filter(filter || (() => true))
    .sort((a, b) => (b.createdAt?.seconds ?? Date.now() / 1000) - (a.createdAt?.seconds ?? Date.now() / 1000));
  box.innerHTML = list.length
    ? list.map(postCard).join('')
    : `<p class="text-center text-gray-500 py-10">${emptyMsg || 'لا توجد منشورات بعد'}</p>`;
  restoreOpenComments();
}

function refreshPosts() {
  renderPosts('feed', null);
  if (profileTarget) renderPosts('uposts', p => p.userId === profileTarget, 'لا توجد منشورات');
}

async function toggleLike(id) {
  const p = postsCache[id];
  if (!p) return;
  const old = [...(p.likes || [])];
  const liked = old.includes(uid());
  p.likes = liked ? old.filter(x => x !== uid()) : [...old, uid()];
  refreshPosts();
  try {
    await updateDoc(doc(db, "posts", id), { likes: liked ? arrayRemove(uid()) : arrayUnion(uid()) });
  } catch (err) {
    p.likes = old;
    refreshPosts();
    showToast("تعذر تسجيل الإعجاب: " + err.message);
  }
}

async function toggleSave(id) {
  const ref = doc(db, "users", uid(), "saved", id);
  if (savedIds.has(id)) {
    savedIds.delete(id);
    refreshPosts();
    await deleteDoc(ref);
    showToast("أُزيل من المحفوظات");
  } else {
    savedIds.add(id);
    refreshPosts();
    await setDoc(ref, { postId: id, savedAt: serverTimestamp() });
    showToast("تم الحفظ 🔖");
  }
}

function watchComments(id) {
  commentUnsubs[id] && commentUnsubs[id]();
  $('cbox-' + id)?.classList.remove('hidden');
  const q = query(collection(db, "posts", id, "comments"), orderBy("createdAt", "asc"), limit(50));
  commentUnsubs[id] = onSnapshot(q, (snap) => {
    const box = $('cbox-' + id);
    if (!box) return;
    box.innerHTML = snap.docs.map(d => {
      const c = d.data();
      return `<div class="flex gap-2">${avatarHTML(c.userName, c.userPhoto, 'w-7 h-7 text-xs')}
        <div class="bg-gray-800 rounded-xl px-3 py-2 text-xs"><b>${esc(c.userName)}${badgeHTML(c.verified)}</b><p>${esc(c.text)}</p></div></div>`;
    }).join('') + `
      <form data-form="comment" data-id="${id}" class="flex gap-2 pt-1">
        <input name="t" autocomplete="off" placeholder="اكتب تعليقاً..." class="flex-1 bg-gray-800 rounded-full px-3 py-2 text-xs outline-none">
        <button class="text-indigo-400 text-xs font-bold px-2">إرسال</button>
      </form>`;
  });
}

function openComments(id) {
  if (openSet.has(id)) {
    openSet.delete(id);
    commentUnsubs[id] && commentUnsubs[id]();
    delete commentUnsubs[id];
    $('cbox-' + id)?.classList.add('hidden');
    return;
  }
  openSet.add(id);
  watchComments(id);
}

function restoreOpenComments() {
  openSet.forEach(id => { if ($('cbox-' + id)) watchComments(id); });
}

function viewChat(otherId) {

  const title = isGlobal ? "الدردشة العامة Sovexa" : nameOf(o);
  const cid = isGlobal ? "global" : chatIdFor(uid(), otherId);
  if (!isGlobal) setDoc(doc(db, "chats", cid), { members: [uid(), otherId] }, { merge: true }).catch(() => {});
  V().innerHTML = `
    <div class="flex flex-col h-[calc(100vh-10.5rem)] max-w-2xl mx-auto">
      <div class="flex items-center gap-3 px-3 py-2 border-b border-gray-800 bg-[#111827]">

        ${isGlobal
          ? `<div class="w-9 h-9 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-bold text-sm">S</div>`
          : avatarHTML(nameOf(o), o.photoURL, 'w-9 h-9 text-xs')}
        <div class="min-w-0">
          <b class="block text-sm truncate">${esc(title)}</b>
          <span class="text-[11px] text-emerald-400">${isGlobal ? 'مجتمع Sovexa' : esc(handleOf(o))}</span>
        </div>
      </div>
      <div id="msgs" class="flex-1 overflow-y-auto px-3 py-3 space-y-2 bg-[#0b0f17]"></div>
      <form data-form="msg" data-id="${cid}" class="p-2 flex items-center gap-2 border-t border-gray-800 bg-[#111827]">

        <button class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-pink-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-paper-plane text-sm"></i></button>
      </form>
    </div>`;
  unsubs.push(onSnapshot(query(collection(db, "chats", cid, "messages"), orderBy("createdAt", "asc"), limit(200)), (snap) => {
    const el = $('msgs');
    if (!el) return;
    if (snap.empty) {
      el.innerHTML = '<p class="text-center text-gray-500 text-xs py-10">ابدأ المحادثة الآن</p>';
      return;
    }
    el.innerHTML = snap.docs.map(d => {
      const m = d.data();
      const mine = m.senderId === uid();
      const sender = allUsers[m.senderId];
      const senderLine = (!mine && isGlobal)
        ? `<div class="text-[11px] text-indigo-300 mb-0.5 px-1">${esc(sender ? nameOf(sender) : (m.senderName || ''))}${badgeHTML(isVerified(sender))}</div>` : '';
      return `
        <div class="flex items-end gap-2 ${mine ? 'justify-end' : 'justify-start'}">
          ${!mine ? avatarHTML(sender ? nameOf(sender) : (m.senderName || '?'), sender?.photoURL, 'w-7 h-7 text-[10px]') : ''}
          <div class="max-w-[75%]">
            ${senderLine}
            <div class="${mine ? 'bubble-me' : 'bubble-other'} px-3 py-2 text-sm whitespace-pre-wrap break-words">${esc(m.text)}</div>
          </div>
        </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  }));
}

        <div class="card rounded-xl p-3 text-sm text-center"><b class="text-indigo-300">${SUB_PRICE}</b></div>
        <button data-act="subscribe-confirm" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-pink-600 font-bold text-sm">طلب الاشتراك</button>
        <p class="text-[11px] text-gray-500 text-center">سيتم تفعيل التوثيق بعد تأكيد الدفع</p>`}
      <button data-act="subscribe-cancel" class="w-full py-2 text-sm text-gray-400">إغلاق</button>
    </div>`;
  sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.remove(); });
  document.body.appendChild(sheet);
}

function showLogin() {
  $('loginSection').classList.remove('hidden');
  $('appSection').classList.add('hidden');
}
function showApp() {
  $('loginSection').classList.add('hidden');
  $('appSection').classList.remove('hidden');
}

async function ensureUserProfile(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, {
      uid: user.uid, name: nameOf(user), username: "",
      email: user.email || "", phone: user.phoneNumber || "",
      photoURL: user.photoURL || "", coverURL: "", bio: "",
      following: [], verified: false, createdAt: serverTimestamp()
    });
  } else {
    await setDoc(ref, { email: user.email || "", phone: user.phoneNumber || "" }, { merge: true });
  }
}

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (!user) {
    clearListeners();
    if (usersUnsub) { usersUnsub(); usersUnsub = null; }
    if (postsUnsub) { postsUnsub(); postsUnsub = null; }
    if (savedUnsub) { savedUnsub(); savedUnsub = null; }
    postsCache = {};
    savedIds = new Set();
    showLogin();
    return;
  }
  showApp();
  try { await ensureUserProfile(user); } catch (e) { showToast("تعذر حفظ الملف: " + e.message); }
  if (!usersUnsub) {
    usersUnsub = onSnapshot(collection(db, "users"), (s) => {
      allUsers = {};
      usersByUsername = {};
      s.forEach(d => {
        const data = { uid: d.id, ...d.data() };
        allUsers[d.id] = data;
        if (data.username) usersByUsername[data.username] = d.id;
      });
      renderUsersLive();
    }, (err) => showToast("تعذر تحميل المستخدمين: " + err.message));
  }
  if (!postsUnsub) {
    postsUnsub = onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(100)), (s) => {
      postsCache = {};
      s.forEach(d => postsCache[d.id] = d.data());
      refreshPosts();
      if (currentView === 'saved') renderSavedList();
      if (currentView === 'archive') viewArchive();
    }, (err) => showToast("تعذر تحميل المنشورات: " + err.message));
  }
  if (!savedUnsub) {
    savedUnsub = onSnapshot(collection(db, "users", user.uid, "saved"), (s) => {
      savedIds = new Set(s.docs.map(d => d.id));
      refreshPosts();
      if (currentView === 'saved') renderSavedList();
    }, () => {});
  }
  go('home');
});

      showToast("خطأ: " + err.message);
    }
  }
});

// ---------- global events ----------
document.addEventListener('click', async (e) => {
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go, g.dataset.id); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const { act, id } = a.dataset;
  try {
    if (act === 'like') {
      await toggleLike(id);
    } else if (act === 'comments') {
      openComments(id);
    } else if (act === 'save') {
      await toggleSave(id);
    } else if (act === 'share') {
      const p = postsCache[id] || {};
      if (navigator.share) {
        navigator.share({ title: 'Sovexa', text: p.text || 'منشور من Sovexa', url: location.href }).catch(() => {});
      } else {
        navigator.clipboard?.writeText(location.href);
        showToast("تم نسخ رابط التطبيق");
      }
    } else if (act === 'delpost') {
      if (confirm('حذف هذا المنشور؟')) await deleteDoc(doc(db, "posts", id));
    } else if (act === 'follow') {
      const isF = (me().following || []).includes(id);
      await updateDoc(doc(db, "users", uid()), { following: isF ? arrayRemove(id) : arrayUnion(id) });
    } else if (act === 'subscribe') {
      showSubscribeSheet();
    } else if (act === 'subscribe-confirm') {
      await setDoc(doc(db, "subscriptions", uid()), {
        userId: uid(), status: "pending", price: SUB_PRICE, createdAt: serverTimestamp()
      });
      document.getElementById('subSheet')?.remove();
      showToast("تم تسجيل طلب الاشتراك، بانتظار تأكيد الدفع");
    } else if (act === 'subscribe-cancel') {
      document.getElementById('subSheet')?.remove();
    } else if (act === 'soon') {
      showToast("هذه الميزة قريباً");
    } else if (act === 'logout-menu') {
      showLogoutSheet();
    } else if (act === 'logout-confirm') {
      document.getElementById('logoutSheet')?.remove();
      await signOut(auth);
    } else if (act === 'logout-switch') {
      document.getElementById('logoutSheet')?.remove();
      await signOut(auth);
      showToast("سجّل الدخول بالحساب الآخر");
    } else if (act === 'logout-cancel') {
      document.getElementById('logoutSheet')?.remove();
    }
  } catch (err) {
    showToast("خطأ: " + err.message);
  }
});
