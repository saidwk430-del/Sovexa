<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovexa - منصة التواصل الاجتماعي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #f3f4f6; }
        .outfit-font { font-family: 'Outfit', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-nav {
            background: rgba(11, 15, 23, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        #bgCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .glow-text { text-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
    </style>
</head>
<body class="min-h-screen relative select-none">

    <!-- Interactive Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- ==================== PART 1: LOGIN VIEW ==================== -->
    <div id="loginSection" class="relative z-10 flex flex-col justify-between items-center min-h-screen p-4">
        
        <!-- Top Bar -->
        <header class="w-full p-4 flex justify-between items-center max-w-7xl mx-auto">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-xs font-semibold tracking-wider text-gray-300 uppercase outfit-font">Sovexa Network</span>
            </div>
        </header>

        <!-- Center Login Box -->
        <main class="flex flex-col items-center justify-center my-auto w-full max-w-md">
            <!-- Logo -->
            <div class="mb-5 flex flex-col items-center">
                <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 p-[2px] shadow-2xl shadow-indigo-500/50">
                    <div class="w-full h-full rounded-[22px] bg-slate-950/80 backdrop-blur-xl flex items-center justify-center border border-white/20">
                        <span class="outfit-font font-black text-5xl text-transparent bg-clip-text bg-gradient-to-tr from-indigo-400 via-pink-400 to-purple-300">S</span>
                    </div>
                </div>
            </div>

            <!-- Form Card -->
            <div class="w-full glass-card p-6 rounded-3xl shadow-2xl">
                <div class="text-center mb-5">
                    <h2 class="text-xl font-bold text-white mb-1">مرحباً بك في Sovexa</h2>
                    <p class="text-xs text-gray-300">سجل الدخول للمتابعة إلى المنصة</p>
                </div>

                <!-- Google Login -->
                <button id="googleLoginBtn" class="w-full py-2.5 px-4 bg-slate-900/90 hover:bg-slate-800 border border-gray-700 text-white font-medium text-xs rounded-xl transition-all flex items-center justify-center gap-3 shadow-md mb-4">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.3s.7 2.6 1.9 5l3.7-2.5z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
                    </svg>
                    <span>متابعة باستخدام Google</span>
                </button>

                <div class="relative flex py-2 items-center mb-4">
                    <div class="flex-grow border-t border-gray-700/80"></div>
                    <span class="flex-shrink mx-3 text-[11px] text-gray-400">أو بالبريد الإلكتروني</span>
                    <div class="flex-grow border-t border-gray-700/80"></div>
                </div>

                <!-- Email Form -->
                <form id="emailForm" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">البريد الإلكتروني</label>
                        <input type="email" id="emailInput" required placeholder="name@sovexa.com" class="w-full bg-slate-900/90 border border-gray-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">كلمة المرور</label>
                        <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-gray-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
                    </div>
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-90 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-500/30 transition-all">
                        تسجيل الدخول / إنشاء حساب
                    </button>
                </form>
            </div>
        </main>

        <footer class="w-py pb-6 text-center">
            <h1 class="outfit-font font-black text-2xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-200 to-pink-300 uppercase">Sovexa</h1>
        </footer>
    </div>


    <!-- ==================== PART 2: MAIN FEED VIEW (Hidden Initially) ==================== -->
    <div id="feedSection" class="relative z-10 hidden min-h-screen pb-20">
        
        <!-- Top Navigation Bar -->
        <header class="sticky top-0 z-50 w-full glass-nav px-4 py-2.5">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <a href="#" class="flex items-center gap-2">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 p-[1.5px] shadow-lg">
                            <div class="w-full h-full rounded-[10px] bg-slate-950 flex items-center justify-center">
                                <span class="outfit-font font-black text-xl text-transparent bg-clip-text bg-gradient-to-tr from-indigo-400 to-pink-400">S</span>
                            </div>
                        </div>
                        <span class="outfit-font font-black text-2xl tracking-wider text-white hidden sm:block glow-text">Sovexa</span>
                    </a>
                </div>

                <div class="flex items-center gap-2.5">
                    <button class="w-9 h-9 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-gray-300">
                        <i class="fa-solid fa-bell text-xs"></i>
                    </button>
                    <button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-red-500/20 text-red-400 text-xs font-semibold hover:bg-red-500/30 transition-colors">
                        <i class="fa-solid fa-right-from-bracket ml-1"></i> خروج
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Feed Layout -->
        <div class="max-w-3xl mx-auto px-4 pt-4 space-y-4">
            
            <!-- Create Post Box -->
            <section class="glass-card p-4 rounded-2xl border border-slate-800">
                <div class="flex items-center gap-3 pb-3 border-b border-slate-800/80">
                    <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold" id="userAvatarLetter">S</div>
                    <input type="text" placeholder="بماذا تفكر اليوم؟" class="w-full bg-slate-900/80 border border-slate-800 rounded-full px-4 py-2.5 text-xs text-white focus:outline-none">
                </div>
                <div class="flex items-center justify-between pt-3 text-xs">
                    <button class="flex items-center gap-2 text-emerald-400"><i class="fa-solid fa-image"></i> صورة / فيديو</button>
                    <button class="px-4 py-1.5 bg-gradient-to-r from-indigo-600 to-pink-600 text-white font-semibold rounded-xl">نشر</button>
                </div>
            </section>

            <!-- Sample Post -->
            <article class="glass-card p-4 rounded-2xl border border-slate-800 space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center text-white font-bold">أ</div>
                        <div>
                            <h4 class="font-bold text-xs text-white">أحمد علي</h4>
                            <p class="text-[10px] text-gray-400">منذ ساعتين • <i class="fa-solid fa-globe"></i></p>
                        </div>
                    </div>
                </div>
                <p class="text-xs text-gray-200">أهلاً بكم في أول منشور حقيقي على منصة Sovexa المتطورة! 🚀✨</p>
                <div class="rounded-xl overflow-hidden border border-slate-800">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=80" class="w-full max-h-72 object-cover" alt="Post">
                </div>
            </article>

        </div>
    </div>


    <!-- ==================== FIREBASE & AUTH LOGIC ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCJm_0O6NzS0UYnoYAv5MUIp-QR9xGN18Q",
          authDomain: "sovexa-fbc93.firebaseapp.com",
          projectId: "sovexa-fbc93",
          storageBucket: "sovexa-fbc93.firebasestorage.app",
          messagingSenderId: "147264654219",
          appId: "1:147264654219:web:7487b91cc6c5fa041efd8e",
          measurementId: "G-5PBTY2WXJ6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginSection = document.getElementById('loginSection');
        const feedSection = document.getElementById('feedSection');

        // Check Auth State (Auto Login Transition)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                feedSection.classList.remove('hidden');
                if(user.email) {
                    document.getElementById('userAvatarLetter').innerText = user.email.charAt(0).toUpperCase();
                }
            } else {
                feedSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            }
        });

        // Email Sign In / Sign Up
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } catch (signUpError) {
                        alert('خطأ: ' + signUpError.message);
                    }
                } else {
                    alert('خطأ: ' + error.message);
                }
            }
        });

        // Google Sign In
        const provider = new GoogleAuthProvider();
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert('فشل الدخول بحساب Google: ' + error.message);
            }
        });

        // Logout Global Function
        window.logout = async () => {
            await signOut(auth);
        };
    </script>


    <!-- Background Animation -->
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.color = Math.random() > 0.5 ? '#6366f1' : '#ec4899';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 12; ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }
        for (let i = 0; i < 50; i++) particles.push(new Particle());

        function animate() {
            ctx.fillStyle = '#0b0f17';
            ctx.fillRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
