}

function compressImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setActiveTab(view) {

function go(view, id) {

    profile: viewProfile, edit: viewEdit, search: viewSearch, friends: viewFriends,

      ${p.userId === uid() ? `<button data-act="delpost" data-id="${p.id}" class="text-gray-500 px-2"><i class="fa-solid fa-trash"></i></button>` : ''}
    </div>
    ${p.text ? `<p class="px-3 pb-3 text-sm whitespace-pre-wrap">${esc(p.text)}</p>` : ''}

      <button data-act="like" data-id="${p.id}" class="flex-1 py-2 flex items-center justify-center gap-1.5 ${liked ? 'text-pink-400 font-bold' : ''}">
        <i class="fa-${liked ? 'solid' : 'regular'} fa-heart"><span>${likes.length}</span></i>

      <button data-act="comments" data-id="${p.id}" class="flex-1 py-2 flex items-center justify-center gap-1.5">

}

  box.innerHTML = list.length ? list.map(postCard).join('') : `<p class="text-center text-gray-500 py-10">${emptyMsg || 'لا توجد منشورات بعد'}</p>`;
  restoreOpenComments();
}

// --- تعليقات تدعم النصوص والصور ---
function renderComments(id) {
  const box = $('cbox-' + id);
  if (!box) return;
  const docs = commentsData[id] || [];
  box.innerHTML = docs.map(c => `
    <div class="flex gap-2">
      ${avatarHTML(c.userName, c.userPhoto, 'w-7 h-7 text-xs')}
      <div class="min-w-0 flex-1 bg-gray-800 rounded-xl px-3 py-2 text-xs">
        <b>${esc(c.userName)}${badgeHTML(vOf(c.userId, c.verified))}</b>
        <p class="whitespace-pre-wrap break-words mt-1">${esc(c.text)}</p>
        ${c.image ? `<img src="${esc(c.image)}" class="mt-2 rounded-lg max-h-40 object-cover">` : ''}
      </div>
    </div>`).join('') + `
    <div id="commentPrev-${id}"></div>
    <form data-form="comment" data-id="${id}" class="flex items-center gap-2 pt-1">
      <label class="text-emerald-400 cursor-pointer p-2"><i class="fa-solid fa-image"></i><input type="file" accept="image/*" class="hidden comment-img-input" data-id="${id}"></label>
      <input name="t" autocomplete="off" placeholder="اكتب تعليقاً..." class="flex-1 bg-gray-800 rounded-full px-3 py-2 text-xs outline-none">
      <button class="text-indigo-400 text-xs font-bold px-2">إرسال</button>
    </form>`;
}

function watchComments(id) {
  commentUnsubs[id] && commentUnsubs[id]();
  $('cbox-' + id)?.classList.remove('hidden');
  renderComments(id);
  commentUnsubs[id] = onSnapshot(query(collection(db, "posts", id, "comments"), orderBy("createdAt", "asc"), limit(50)), (snap) => {
    commentsData[id] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderComments(id);
  });
}

function openComments(id) {
  if (openSet.has(id)) {
    openSet.delete(id);
    commentUnsubs[id] && commentUnsubs[id]();
    delete commentUnsubs[id];
    $('cbox-' + id)?.classList.add('hidden');
    return;
  }
  openSet.add(id);
  watchComments(id);
}

function restoreOpenComments() {
  openSet.forEach(id => { if ($('cbox-' + id)) watchComments(id); });
}

// ---------- Firebase Init & Auth ----------
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  $('splash')?.remove();
  if (!user) {
    clearListeners();
    $('loginSection').classList.remove('hidden');
    $('appSection').classList.add('hidden');
    return;
  }
  $('loginSection').classList.add('hidden');
  $('appSection').classList.remove('hidden');

  // الاستماع للمستخدمين والمنشورات والإشعارات والدردشات لتحديث العدادات الحمراء
  usersUnsub = onSnapshot(collection(db, "users"), (s) => {
    allUsers = {};
    s.forEach(d => allUsers[d.id] = { uid: d.id, ...d.data() });
    refreshPosts();
  });
  postsUnsub = onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(50)), (s) => {
    postsCache = {};
    s.forEach(d => postsCache[d.id] = d.data());
    refreshPosts();
  });
  notifUnsub = onSnapshot(query(collection(db, "notifications"), where("toUid", "==", user.uid)), (s) => {
    notifs = s.docs.map(d => ({ id: d.id, ...d.data() }));
    updateBadges();
  });
  chatsUnsub = onSnapshot(query(collection(db, "chats"), where("members", "array-contains", user.uid)), (s) => {
    chatUnreadCount = s.size; // تحديث عدد المحادثات النشطة/الرسائل
    updateBadges();
  });

  go('home');
});

$('emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('emailInput').value.trim();
  const password = $('passwordInput').value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch {
    await createUserWithEmailAndPassword(auth, email, password);
  }
});

// ---------- Events ----------
document.addEventListener('click', async (e) => {
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go, g.dataset.id); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const { act, id } = a.dataset;
  if (act === 'like') {
    const p = postsCache[id];
    if (!p) return;
    const liked = (p.likes || []).includes(uid());
    await updateDoc(doc(db, "posts", id), { likes: liked ? arrayRemove(uid()) : arrayUnion(uid()) });
  } else if (act === 'comments') {
    openComments(id);
  } else if (act === 'save') {
    if (savedIds.has(id)) savedIds.delete(id); else savedIds.add(id);
    refreshPosts();
  } else if (act === 'follow') {
    const isF = (me().following || []).includes(id);
    await updateDoc(doc(db, "users", uid()), { following: isF ? arrayRemove(id) : arrayUnion(id) });
  } else if (act === 'logout') {
    signOut(auth);
  }
});

document.addEventListener('change', async (e) => {
  const f = e.target.files?.[0];
  if (!f) return;
  if (e.target.id === 'postImg') pendingPostImg = await compressImage(f, 800, 0.7);
  if (e.target.id === 'chatImgIn') pendingChatImg = await compressImage(f, 800, 0.7);
  if (e.target.classList.contains('comment-img-input')) {
    pendingCommentImg = await compressImage(f, 800, 0.7);
    const pid = e.target.dataset.id;
    const prev = $(`commentPrev-${pid}`);
    if (prev) prev.innerHTML = `<img src="${pendingCommentImg}" class="w-20 h-20 rounded-lg object-cover mt-1">`;
  }
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const type = f.dataset.form;
  const fd = new FormData(f);
  if (type === 'create') {
    const text = fd.get('text');
    if (!text && !pendingPostImg) return;
    await addDoc(collection(db, "posts"), {
      userId: uid(), userName: nameOf(me()), userPhoto: me().photoURL || '',
      verified: isVerified(me()), text, image: pendingPostImg || '', likes: [], commentsCount: 0, createdAt: serverTimestamp()
    });
    pendingPostImg = null;
    go('home');
  } else if (type === 'comment') {
    const postId = f.dataset.id;
    const text = fd.get('t');
    if (!text && !pendingCommentImg) return;
    await addDoc(collection(db, "posts", postId, "comments"), {
      userId: uid(), userName: nameOf(me()), userPhoto: me().photoURL || '',
      text, image: pendingCommentImg || '', verified: isVerified(me()), createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, "posts", postId), { commentsCount: increment(1) });
    pendingCommentImg = null;
    f.reset();
  } else if (type === 'msg') {
    const text = fd.get('t');
    if (!text && !pendingChatImg) return;
    await addDoc(collection(db, "chats", f.dataset.id, "messages"), {
      text, image: pendingChatImg || '', senderId: uid(), senderName: nameOf(me()), createdAt: serverTimestamp()
    });
    pendingChatImg = null;
    f.reset();
  } else if (type === 'edit') {
    await updateDoc(doc(db, "users", uid()), { name: fd.get('name'), bio: fd.get('bio') });
    go('profile', uid());
  }
});
</script>
