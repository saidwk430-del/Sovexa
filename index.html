window.showToast = (msg) => {
  const box = document.createElement('div');
  box.className = 'card px-4 py-2 rounded-xl text-xs font-bold text-white shadow-xl';

function avatarHTML(name, photo, cls = 'w-10 h-10 text-sm') {
  return photo
    ? `<img src="${esc(photo)}" class="${cls} rounded-full object-cover shrink-0">`
    : `<div class="${cls} rounded-full bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center font-bold text-white shrink-0">${esc((name || "?").charAt(0).toUpperCase())}</div>`;
}

function timeAgo(ts) {
  if (!ts) return "الآن";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('ar', { dateStyle: 'medium', timeStyle: 'short' });
}

function followBtn(id) {
  const f = (me().following || []).includes(id);
  return `<button data-act="follow" data-id="${id}" class="px-3 py-1.5 rounded-lg text-xs font-bold ${f ? 'bg-gray-700 text-gray-200' : 'bg-indigo-600 text-white'}">${f ? 'إلغاء المتابعة' : 'متابعة'}</button>`;
}

function compressImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function withTimeout(promise, ms = 15000) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error("انتهت المهلة، تحقق من الاتصال أو من قواعد Firestore")), ms))
  ]);
}

// ---------- router ----------
function clearListeners() {
  unsubs.forEach(f => f());
  unsubs = [];
  Object.values(commentUnsubs).forEach(f => f && f());
  commentUnsubs = {};
  openSet.clear();
}

function go(view, id) {
  clearListeners();
  currentView = view;
  currentId = id || null;
  document.querySelectorAll('nav [data-go]').forEach(b => b.classList.toggle('text-indigo-400', b.dataset.go === view));
  const views = {
    home: viewHome, reels: viewReels, create: viewCreate, friends: viewFriends,
    menu: viewMenu, search: viewSearch, chats: viewChats, profile: viewProfile,
    chat: viewChat, edit: viewEdit, settings: viewSettings
  };
  (views[view] || viewHome)(id);
  window.scrollTo(0, 0);
}

// ---------- posts & comments ----------
function postCard(id, p) {
  const liked = (p.likes || []).includes(uid());
  const count = (p.likes || []).length;
  return `
  <article class="card rounded-xl overflow-hidden">
    <div class="flex items-center gap-3 p-3">
      ${avatarHTML(p.userName, p.userPhoto)}
      <div class="flex-1 min-w-0">
        <b class="block text-sm text-white truncate">${esc(p.userName)}</b>
        <span class="text-xs text-gray-500">${timeAgo(p.createdAt)}</span>
      </div>
      ${p.userId === uid() ? `<button data-act="delpost" data-id="${id}" class="text-gray-500 px-2"><i class="fa-solid fa-trash"></i></button>` : ''}
    </div>
    ${p.text ? `<p class="px-3 pb-3 text-sm whitespace-pre-wrap">${esc(p.text)}</p>` : ''}
    ${p.image ? `<img src="${esc(p.image)}" class="w-full max-h-[480px] object-cover">` : ''}
    <div class="flex justify-around border-t border-gray-800 text-sm text-gray-400">
      <button data-act="like" data-id="${id}" data-liked="${liked ? 1 : 0}" class="flex-1 py-2 ${liked ? 'text-indigo-400' : ''}"><i class="fa-solid fa-thumbs-up"></i> ${count} إعجاب</button>
      <button data-act="comments" data-id="${id}" class="flex-1 py-2"><i class="fa-regular fa-comment"></i> تعليق</button>
    </div>
    <div id="cbox-${id}" class="hidden p-3 border-t border-gray-800 space-y-2"></div>
  </article>`;
}

function watchComments(id) {
  commentUnsubs[id] && commentUnsubs[id]();
  const box0 = $('cbox-' + id);
  if (box0) box0.classList.remove('hidden');
  const q = query(collection(db, "posts", id, "comments"), orderBy("createdAt", "asc"), limit(50));
  commentUnsubs[id] = onSnapshot(q, (snap) => {
    const box = $('cbox-' + id);
    if (!box) return;
    box.innerHTML = snap.docs.map(d => {
      const c = d.data();
      return `<div class="flex gap-2">${avatarHTML(c.userName, c.userPhoto, 'w-7 h-7 text-xs')}
        <div class="bg-gray-800 rounded-xl px-3 py-2 text-xs"><b>${esc(c.userName)}</b><p>${esc(c.text)}</p></div></div>`;
    }).join('') + `
      <form data-form="comment" data-id="${id}" class="flex gap-2 pt-1">
        <input name="t" autocomplete="off" placeholder="اكتب تعليقاً..." class="flex-1 bg-gray-800 rounded-full px-3 py-2 text-xs outline-none">
        <button class="text-indigo-400 text-xs font-bold px-2">إرسال</button>
      </form>`;
  });
}

function openComments(id) {
  if (openSet.has(id)) {
    openSet.delete(id);
    commentUnsubs[id] && commentUnsubs[id]();
    delete commentUnsubs[id];
    $('cbox-' + id)?.classList.add('hidden');
    return;
  }
  openSet.add(id);
  watchComments(id);
}

function restoreOpenComments() {
  openSet.forEach(id => { if ($('cbox-' + id)) watchComments(id); });
}

      <div id="feed" class="space-y-3"></div>
    </div>`;

    const feed = $('feed');

}

  V().innerHTML = `
    <div class="h-32 bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-600 bg-cover bg-center" style="${u.coverURL ? `background-image:url('${esc(u.coverURL)}')` : ''}"></div>
    <div class="px-4 -mt-12 text-center">
      <div class="inline-block ring-4 ring-[#0b0f17] rounded-full">${avatarHTML(nameOf(u), u.photoURL, 'w-24 h-24 text-3xl')}</div>
      <h2 class="text-xl font-black mt-2">${esc(nameOf(u))}</h2>
      <p class="text-xs text-indigo-300">${esc(handleOf(u))}</p>
      <p class="text-sm text-gray-400 mt-1">${esc(u.bio || '')}</p>
      <p class="text-xs text-gray-500 mt-1">${followers} متابع · ${following} يتابع</p>
      <div class="flex gap-2 justify-center mt-3">
        ${own
          ? `<button data-go="edit" class="px-6 py-2 rounded-lg bg-gray-700 text-sm font-bold">تعديل الملف الشخصي</button>
             <button data-go="settings" class="px-4 py-2 rounded-lg bg-gray-700 text-sm font-bold"><i class="fa-solid fa-gear"></i></button>`
          : `${followBtn(target)}<button data-go="chat" data-id="${target}" class="px-4 py-2 rounded-lg bg-gray-700 text-xs font-bold">مراسلة</button>`}
      </div>
    </div>
    <div id="uposts" class="p-3 space-y-3 mt-4 max-w-xl mx-auto"></div>`;
  unsubs.push(onSnapshot(query(collection(db, "posts"), where("userId", "==", target)), (snap) => {
    const el = $('uposts');
    if (!el) return;
    const t = (d) => d.data().createdAt?.seconds ?? Date.now() / 1000;
    const docs = [...snap.docs].sort((a, b) => t(b) - t(a));
    el.innerHTML = docs.length
      ? docs.map(d => postCard(d.id, d.data())).join('')
      : '<p class="text-center text-gray-500 py-8">لا توجد منشورات</p>';
    restoreOpenComments();
  }));
}

function renderUsersLive() {
  if (!currentUser) return;
  if (currentView === 'search') renderSearch($('q')?.value || '');
  else if (['friends', 'chats', 'profile', 'settings', 'menu'].includes(currentView)) go(currentView, currentId);
}

// ---------- logout sheet ----------
function showLogoutSheet() {
  const old = document.getElementById('logoutSheet');
  if (old) old.remove();
  const sheet = document.createElement('div');
  sheet.id = 'logoutSheet';
  sheet.className = 'fixed inset-0 z-[70] bg-black/60 flex items-end justify-center';
  sheet.innerHTML = `
    <div class="card w-full max-w-md rounded-t-3xl p-4 space-y-2 safe-bottom">
      <div class="mx-auto w-12 h-1.5 rounded-full bg-gray-600 mb-2"></div>
      <p class="text-center text-sm text-gray-400 mb-2">${esc(currentUser?.email || currentUser?.phoneNumber || '')}</p>
      <button data-act="logout-confirm" class="w-full py-3 rounded-xl bg-red-600/20 border border-red-500/30 text-red-300 font-bold text-sm">تسجيل الخروج من هذا الحساب</button>
      <button data-act="logout-switch" class="w-full py-3 rounded-xl bg-gray-800 text-sm font-bold">تبديل الحساب</button>
      <button data-act="logout-cancel" class="w-full py-3 rounded-xl bg-gray-900 text-sm text-gray-400">إلغاء</button>
    </div>`;
  sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.remove(); });
  document.body.appendChild(sheet);
}

// ---------- auth ----------
function showLogin() {
  $('loginSection').classList.remove('hidden');
  $('appSection').classList.add('hidden');
}
function showApp() {
  $('loginSection').classList.add('hidden');
  $('appSection').classList.remove('hidden');
}

async function ensureUserProfile(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, {
      uid: user.uid,
      name: nameOf(user),
      username: "",
      email: user.email || "",
      phone: user.phoneNumber || "",
      photoURL: user.photoURL || "",
      coverURL: "",
      bio: "",
      following: [],
      createdAt: serverTimestamp()
    });
  } else {
    await setDoc(ref, { email: user.email || "", phone: user.phoneNumber || "" }, { merge: true });
  }
}

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (!user) {
    clearListeners();
    if (usersUnsub) { usersUnsub(); usersUnsub = null; }
    showLogin();
    return;
  }
  showApp();
  try { await ensureUserProfile(user); } catch (e) { showToast("تعذر حفظ الملف: " + e.message); }
  if (!usersUnsub) {
    usersUnsub = onSnapshot(collection(db, "users"), (s) => {
      allUsers = {};
      usersByUsername = {};
      s.forEach(d => {
        const data = { uid: d.id, ...d.data() };
        allUsers[d.id] = data;
        if (data.username) usersByUsername[data.username] = d.id;
      });
      renderUsersLive();
    }, (err) => showToast("تعذر تحميل المستخدمين: " + err.message));
  }
  go('home');
});

getRedirectResult(auth).catch(err => showToast("خطأ Google: " + err.message));
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: "select_account" });

$('googleLoginBtn').addEventListener('click', async () => {
  try { await signInWithPopup(auth, googleProvider); }
  catch (err) {
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
      await signInWithRedirect(auth, googleProvider); return;
    }
    showToast("خطأ Google: " + err.message);
  }
});

$('emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('emailInput').value.trim();
  const password = $('passwordInput').value;
  if (!email || !password) return showToast("أدخل البريد وكلمة المرور");
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found') {
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        showToast("تم إنشاء حسابك");
      } catch (e2) {
        showToast(e2.code === 'auth/email-already-in-use' ? "كلمة المرور غير صحيحة لهذا البريد" : "خطأ: " + e2.message);
      }
    } else {
      showToast("خطأ: " + err.message);
    }
  }
});

const getRecaptcha = () => {
  if (!recaptcha) recaptcha = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
  return recaptcha;
};
$('togglePhoneBtn').addEventListener('click', () => $('phonePanel').classList.toggle('hidden'));
$('sendCodeBtn').addEventListener('click', async () => {
  const phone = $('phoneInput').value.trim();
  if (!/^\+\d{8,15}$/.test(phone)) return showToast("أدخل الرقم بصيغة دولية مثل +966500000000");
  try {
    confirmationResult = await signInWithPhoneNumber(auth, phone, getRecaptcha());
    $('phoneStep').classList.add('hidden');
    $('codeStep').classList.remove('hidden');
    showToast("تم إرسال الرمز");
  } catch (err) {
    if (recaptcha) { try { recaptcha.clear(); } catch (_) {} }
    recaptcha = null;
    $('recaptcha-container').innerHTML = '';
    showToast("خطأ الهاتف: " + err.message);
  }
});
$('verifyCodeBtn').addEventListener('click', async () => {
  if (!confirmationResult) return;
  try { await confirmationResult.confirm($('codeInput').value.trim()); }
  catch (err) { showToast("رمز غير صحيح"); }
});
$('backToPhoneBtn').addEventListener('click', () => {
  $('codeStep').classList.add('hidden');
  $('phoneStep').classList.remove('hidden');
  confirmationResult = null;
});

// ---------- global events ----------
document.addEventListener('click', async (e) => {
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go, g.dataset.id); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const { act, id } = a.dataset;
  try {
    if (act === 'like') {
      const liked = a.dataset.liked === '1';
      await updateDoc(doc(db, "posts", id), { likes: liked ? arrayRemove(uid()) : arrayUnion(uid()) });
    } else if (act === 'comments') {
      openComments(id);
    } else if (act === 'delpost') {
      if (confirm('حذف هذا المنشور؟')) await deleteDoc(doc(db, "posts", id));
    } else if (act === 'follow') {
      const isF = (me().following || []).includes(id);
      await updateDoc(doc(db, "users", uid()), { following: isF ? arrayRemove(id) : arrayUnion(id) });
    } else if (act === 'logout-menu') {
      showLogoutSheet();
    } else if (act === 'logout-confirm') {
      document.getElementById('logoutSheet')?.remove();
      await signOut(auth);
    } else if (act === 'logout-switch') {
      document.getElementById('logoutSheet')?.remove();
      await signOut(auth);
      showToast("سجّل الدخول بالحساب الآخر");
    } else if (act === 'logout-cancel') {
      document.getElementById('logoutSheet')?.remove();
    }
  } catch (err) {
    showToast("خطأ: " + err.message);
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'q') renderSearch(e.target.value);
});

document.addEventListener('change', async (e) => {
  const f = e.target.files?.[0];
  if (!f) return;
  try {
    if (e.target.id === 'photoIn') {
      pendingPhoto = await compressImage(f, 256, 0.7);
      $('photoPrev').innerHTML = `<img src="${pendingPhoto}" class="w-24 h-24 rounded-full object-cover">`;
    } else if (e.target.id === 'coverIn') {
      pendingCover = await compressImage(f, 600, 0.6);
      showToast("تم اختيار الغلاف");
    } else if (e.target.id === 'postImg') {
      pendingPostImg = await compressImage(f, 800, 0.7);
      $('postPrev').innerHTML = `<img src="${pendingPostImg}" class="w-full rounded-xl">`;
    }
  } catch (err) { showToast("تعذر معالجة الصورة"); }
});

document.addEventListener('submit', async (e) => {
  const f = e.target;
  const type = f.dataset.form;
  if (!type) return;
  e.preventDefault();
  const fd = new FormData(f);
  const btn = f.querySelector('button[type="submit"], button:not([type])');
  try {
    if (type === 'comment') {
      const t = (fd.get('t') || '').toString().trim();
      if (!t) return;
      await addDoc(collection(db, "posts", f.dataset.id, "comments"), {
        userId: uid(), userName: nameOf(me()), userPhoto: me().photoURL || '', text: t, createdAt: serverTimestamp()
      });
      f.reset();
    } else if (type === 'msg') {
      const t = (fd.get('t') || '').toString().trim();
      if (!t) return;
      const cid = chatIdFor(uid(), f.dataset.id);
      await addDoc(collection(db, "chats", cid, "messages"), { text: t, senderId: uid(), createdAt: serverTimestamp() });
      f.reset();
    } else if (type === 'create') {
      const text = (fd.get('text') || '').toString().trim();
      if (!text && !pendingPostImg) return showToast("اكتب شيئاً أو أضف صورة");
      await addDoc(collection(db, "posts"), {
        userId: uid(), userName: nameOf(me()), userPhoto: me().photoURL || '',
        text, image: pendingPostImg || '', likes: [], createdAt: serverTimestamp()
      });
      pendingPostImg = null;
      showToast("تم النشر");
      go('home');
    } else if (type === 'edit') {
      if (btn) { btn.disabled = true; btn.textContent = "جاري الحفظ..."; btn.classList.add('btn-busy'); }
      const name = (fd.get('name') || '').toString().trim();
      const username = normUser(fd.get('username'));
      const bio = (fd.get('bio') || '').toString().trim();
      if (!name) throw new Error("الاسم مطلوب");
      if (username.length < 3) throw new Error("اسم المستخدم يجب أن يكون 3 أحرف على الأقل");
      const takenBy = usersByUsername[username];
      if (takenBy && takenBy !== uid()) throw new Error("اسم المستخدم مستخدم من شخص آخر، اختر اسماً مختلفاً");
      const data = { name, username, bio };
      if (pendingPhoto) data.photoURL = pendingPhoto;
      if (pendingCover) data.coverURL = pendingCover;
      await withTimeout(setDoc(doc(db, "users", uid()), data, { merge: true }));
      pendingPhoto = null;
      pendingCover = null;
      showToast("تم حفظ التعديلات");
      go('profile', uid());
    }
  } catch (err) {
    showToast("خطأ: " + err.message);
    if (type === 'edit' && btn) { btn.disabled = false; btn.textContent = "حفظ"; btn.classList.remove('btn-busy'); }
  }
});
</script>
