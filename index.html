<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovexa - تسجيل الدخول</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f17;
            color: #f3f4f6;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .outfit-font {
            font-family: 'Outfit', sans-serif;
        }
        /* Fullscreen Canvas Background */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Glassmorphism Panel */
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        /* Glowing Text Effect */
        .glow-text {
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.6), 0 0 40px rgba(236, 72, 153, 0.4);
        }
        .glow-letter {
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.8), 0 0 60px rgba(236, 72, 153, 0.6);
        }
    </style>
</head>
<body class="relative flex flex-col justify-between items-center min-h-screen select-none overflow-hidden">

    <!-- Fullscreen Interactive Animated Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Overlay Tint for Depth -->
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/40 via-transparent to-slate-950/80 z-0 pointer-events-none"></div>

    <!-- Top Header / Bar -->
    <header class="relative z-10 w-full p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-xs font-semibold tracking-wider text-gray-300 uppercase outfit-font">Sovexa Network</span>
        </div>
        <button onclick="toggleLoginForm()" class="px-4 py-2 text-xs font-medium bg-white/10 hover:bg-white/20 text-white rounded-full backdrop-blur-md border border-white/10 transition-all flex items-center gap-2">
            <i class="fa-solid fa-eye" id="toggleIcon"></i>
            <span id="toggleBtnText">إخفاء نموذج الدخول</span>
        </button>
    </header>

    <!-- Center Content: Logo Box + Login Form -->
    <main class="relative z-10 flex flex-col items-center justify-center my-auto px-4 w-full max-w-md">
        
        <!-- Center Icon S Container -->
        <div class="mb-6 flex flex-col items-center group cursor-pointer" onclick="toggleLoginForm()">
            <div class="w-28 h-28 sm:w-36 sm:h-36 rounded-3xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 p-[2px] shadow-2xl shadow-indigo-500/50 transition-all duration-500 transform group-hover:scale-105 group-hover:rotate-1">
                <div class="w-full h-full rounded-[22px] bg-slate-950/80 backdrop-blur-xl flex items-center justify-center border border-white/20">
                    <span class="outfit-font font-black text-6xl sm:text-7xl text-transparent bg-clip-text bg-gradient-to-tr from-indigo-400 via-pink-400 to-purple-300 glow-letter">
                        S
                    </span>
                </div>
            </div>
        </div>

        <!-- Glass Login Form Box -->
        <div id="loginCard" class="w-full glass-card p-6 sm:p-8 rounded-3xl transition-all duration-500 transform opacity-100 scale-100">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-white mb-1">مرحباً بك في Sovexa</h2>
                <p class="text-xs text-gray-300">سجل دخولك للتواصل مع أصدقائك والعالم</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('جارٍ ربط قاعدة البيانات لحفظ الحسابات...');" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">البريد الإلكتروني / اسم المستخدم</label>
                    <div class="relative">
                        <input type="text" required placeholder="name@sovexa.com" class="w-full bg-slate-900/80 border border-gray-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-colors pr-10">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">كلمة المرور</label>
                    <div class="relative">
                        <input type="password" required placeholder="••••••••" class="w-full bg-slate-900/80 border border-gray-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-colors pr-10">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-gray-400">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="rounded bg-slate-800 border-gray-700 text-indigo-600 focus:ring-0">
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="text-indigo-400 hover:underline">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-500/30 transition-all transform active:scale-95">
                    تسجيل الدخول
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-gray-800/80 text-center">
                <p class="text-xs text-gray-400">
                    ليس لديك حساب؟ 
                    <a href="#" onclick="alert('سنتيح إنشاء الحساب فور ربط قاعدة البيانات!');" class="text-pink-400 font-semibold hover:underline">إنشاء حساب جديد</a>
                </p>
            </div>
        </div>

    </main>

    <!-- Bottom Brand Title Sovexa -->
    <footer class="relative z-10 w-full pb-8 pt-4 text-center">
        <h1 class="outfit-font font-black text-4xl sm:text-5xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-200 to-pink-300 glow-text uppercase">
            Sovexa
        </h1>
        <div class="w-2 h-2 rounded-full bg-indigo-500 mx-auto mt-2 shadow-lg shadow-indigo-500/80 animate-ping"></div>
    </footer>

    <!-- Background Animation Script -->
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Create Glowing Particles
        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.color = Math.random() > 0.5 ? '#6366f1' : '#ec4899';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 65; i++) {
            particles.push(new Particle());
        }

        function animate() {
            // Draw gradient background on canvas
            const bgGradient = ctx.createLinearGradient(0, 0, width, height);
            bgGradient.addColorStop(0, '#0b0f17');
            bgGradient.addColorStop(0.5, '#1e1b4b');
            bgGradient.addColorStop(1, '#0f172a');

            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Draw glowing circles in corners
            ctx.save();
            ctx.shadowBlur = 100;
            ctx.shadowColor = '#4f46e5';
            ctx.fillStyle = 'rgba(79, 70, 229, 0.15)';
            ctx.beginPath();
            ctx.arc(width * 0.2, height * 0.3, 180, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = '#ec4899';
            ctx.fillStyle = 'rgba(236, 72, 153, 0.12)';
            ctx.beginPath();
            ctx.arc(width * 0.8, height * 0.7, 220, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Render Particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Toggle Login Form visibility for clean view
        let isFormVisible = true;
        function toggleLoginForm() {
            const card = document.getElementById('loginCard');
            const icon = document.getElementById('toggleIcon');
            const btnText = document.getElementById('toggleBtnText');
            
            isFormVisible = !isFormVisible;
            if (isFormVisible) {
                card.style.opacity = '1';
                card.style.transform = 'scale(1)';
                card.style.pointerEvents = 'auto';
                icon.className = 'fa-solid fa-eye';
                btnText.innerText = 'إخفاء نموذج الدخول';
            } else {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                card.style.pointerEvents = 'none';
                icon.className = 'fa-solid fa-eye-slash';
                btnText.innerText = 'إظهار نموذج الدخول';
            }
        }
    </script>
</body>
</html>
