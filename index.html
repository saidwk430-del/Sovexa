<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovexa - منصة التواصل الاجتماعي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #f3f4f6; }
        .outfit-font { font-family: 'Outfit', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-nav {
            background: rgba(11, 15, 23, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .post-media-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #bgCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .glow-text { text-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
    </style>
</head>
<body class="min-h-screen relative select-none">

    <!-- Interactive Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Toast Notification Popup Container -->
    <div id="toastContainer" class="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

    <!-- ==================== PART 1: LOGIN VIEW ==================== -->
    <div id="loginSection" class="relative z-10 flex flex-col justify-between items-center min-h-screen p-4">
        <header class="w-full p-4 flex justify-between items-center max-w-7xl mx-auto">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-xs font-semibold tracking-wider text-gray-300 uppercase outfit-font">Sovexa Network</span>
            </div>
        </header>

        <main class="flex flex-col items-center justify-center my-auto w-full max-w-md">
            <div class="mb-5 flex flex-col items-center">
                <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 p-[2px] shadow-2xl shadow-indigo-500/50">
                    <div class="w-full h-full rounded-[22px] bg-slate-950/80 backdrop-blur-xl flex items-center justify-center border border-white/20">
                        <span class="outfit-font font-black text-5xl text-transparent bg-clip-text bg-gradient-to-tr from-indigo-400 via-pink-400 to-purple-300">S</span>
                    </div>
                </div>
            </div>

            <div class="w-full glass-card p-6 rounded-3xl shadow-2xl">
                <div class="text-center mb-5">
                    <h2 class="text-xl font-bold text-white mb-1">مرحباً بك في Sovexa</h2>
                    <p class="text-xs text-gray-300">سجل الدخول للمتابعة إلى المنصة</p>
                </div>

                <!-- Google Login -->
                <button id="googleLoginBtn" class="w-full py-2.5 px-4 bg-slate-900/90 hover:bg-slate-800 border border-gray-700 text-white font-medium text-xs rounded-xl transition-all flex items-center justify-center gap-3 shadow-md mb-3">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.3s.7 2.6 1.9 5l3.7-2.5z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
                    </svg>
                    <span>متابعة باستخدام Google</span>
                </button>

                <!-- Phone Login Toggle -->
                <button id="togglePhoneBtn" class="w-full py-2.5 px-4 bg-slate-900/90 hover:bg-slate-800 border border-gray-700 text-white font-medium text-xs rounded-xl transition-all flex items-center justify-center gap-3 shadow-md mb-4">
                    <i class="fa-solid fa-phone text-emerald-400"></i>
                    <span>متابعة برقم الهاتف</span>
                </button>

                <!-- Phone Login Panel -->
                <div id="phonePanel" class="hidden mb-4 space-y-3">
                    <!-- Step 1: phone number -->
                    <div id="phoneStep">
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">رقم الهاتف (مع رمز الدولة)</label>
                        <input type="tel" id="phoneInput" placeholder="+966500000000" dir="ltr" class="w-full bg-slate-900/90 border border-gray-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
                        <button id="sendCodeBtn" class="w-full mt-3 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-90 text-white font-bold text-xs rounded-xl shadow-lg transition-all">
                            إرسال رمز التحقق
                        </button>
                    </div>

                    <!-- Step 2: verification code -->
                    <div id="codeStep" class="hidden">
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">أدخل الرمز المرسل إلى هاتفك</label>
                        <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="123456" dir="ltr" class="w-full bg-slate-900/90 border border-gray-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-xs text-white text-center tracking-widest focus:outline-none">
                        <button id="verifyCodeBtn" class="w-full mt-3 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-90 text-white font-bold text-xs rounded-xl shadow-lg transition-all">
                            تأكيد الرمز
                        </button>
                        <button id="backToPhoneBtn" class="w-full mt-2 text-[11px] text-gray-400 hover:text-white">
                            تغيير الرقم
                        </button>
                    </div>
                </div>

                <div class="relative flex py-2 items-center mb-4">
                    <div class="flex-grow border-t border-gray-700/80"></div>
                    <span class="flex-shrink mx-3 text-[11px] text-gray-400">أو بالبريد الإلكتروني</span>
                    <div class="flex-grow border-t border-gray-700/80"></div>
                </div>

                <form id="emailForm" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">البريد الإلكتروني</label>
                        <input type="email" id="emailInput" required placeholder="name@sovexa.com" class="w-full bg-slate-900/90 border border-gray-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-300 mb-1">كلمة المرور</label>
                        <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-gray-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
                    </div>
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-90 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-500/30 transition-all">
                        تسجيل الدخول / إنشاء حساب
                    </button>
                </form>
            </div>

            <!-- Invisible reCAPTCHA container (required for phone login) -->
            <div id="recaptcha-container"></div>
        </main>

        <footer class="w-full pb-6 text-center">
            <h1 class="outfit-font font-black text-2xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-200 to-pink-300 uppercase">Sovexa</h1>
        </footer>
    </div>


    <!-- ==================== MAIN NAVBAR ==================== -->
    <header id="mainHeader" class="sticky top-0 z-50 w-full glass-nav px-4 py-2.5 hidden">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <button onclick="showSection('feed')" class="flex items-center gap-2 focus:outline-none">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 p-[1.5px] shadow-lg">
                        <div class="w-full h-full rounded-[10px] bg-slate-950 flex items-center justify-center">
                            <span class="outfit-font font-black text-xl text-transparent bg-clip-text bg-gradient-to-tr from-indigo-400 to-pink-400">S</span>
                        </div>
                    </div>
                    <span class="outfit-font font-black text-2xl tracking-wider text-white hidden sm:block glow-text">Sovexa</span>
                </button>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex items-center gap-2">
                <button onclick="showSection('feed')" class="px-3 py-1.5 rounded-xl bg-slate-900/80 border border-slate-800 text-gray-300 hover:text-white text-xs font-semibold transition-all">
                    <i class="fa-solid fa-house ml-1"></i> الرئيسية
                </button>

                <button onclick="showSection('chat')" class="px-3 py-1.5 rounded-xl bg-purple-600/30 border border-purple-500/40 text-purple-300 hover:text-white text-xs font-semibold transition-all">
                    <i class="fa-solid fa-comments ml-1"></i> الدردشة
                </button>

                <button onclick="showSection('profile')" class="px-3 py-1.5 rounded-xl bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 hover:text-white text-xs font-semibold transition-all">
                    <i class="fa-solid fa-user ml-1"></i> ملفي
                </button>
            </div>
        </div>
    </header>


    <!-- ==================== PART 2: MAIN FEED VIEW ==================== -->
    <div id="feedSection" class="relative z-10 hidden min-h-screen pb-20">
        <div class="max-w-3xl mx-auto px-4 pt-4 space-y-4">

            <!-- Create Post Box with Image Support -->
            <section class="glass-card p-4 rounded-2xl border border-slate-800">
                <div class="flex items-center gap-3 pb-3 border-b border-slate-800/80">
                    <div class="w-10 h-10 rounded-full overflow-hidden bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center text-white font-bold userAvatarContainer">
                        <span class="userAvatarLetter">S</span>
                    </div>
                    <input type="text" id="postInput" placeholder="بماذا تفكر اليوم؟" class="w-full bg-slate-900/80 border border-slate-800 rounded-full px-4 py-2.5 text-xs text-white focus:outline-none">
                </div>

                <!-- Hidden Native File Input -->
                <input type="file" id="mediaFileInput" accept="image/*" class="hidden" onchange="handleImageSelection(event)">

                <div class="flex items-center justify-between pt-3 text-xs">
                    <button onclick="document.getElementById('mediaFileInput').click()" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300 font-semibold transition-all">
                        <i class="fa-solid fa-image text-sm"></i> صورة
                    </button>
                    <button id="submitPostBtn" onclick="createNewPost()" class="px-5 py-1.5 bg-gradient-to-r from-indigo-600 to-pink-600 hover:opacity-90 text-white font-bold rounded-xl transition-all shadow-md flex items-center gap-1.5">
                        <span>نشر</span>
                    </button>
                </div>
            </section>

            <!-- Dynamic Feed Posts List -->
            <div id="postsContainer" class="space-y-4"></div>

        </div>
    </div>


    <!-- ==================== PART 3: CHAT VIEW ==================== -->
    <div id="chatSection" class="relative z-10 hidden min-h-[calc(100vh-80px)] pb-10">
        <div class="max-w-4xl mx-auto px-4 pt-4">
            <div class="glass-card rounded-3xl border border-slate-800 overflow-hidden flex flex-col h-[75vh]">
                <div class="p-3.5 border-b border-slate-800 bg-slate-950/60">
                    <h4 class="text-xs font-bold text-white">الدردشة العامة Sovexa</h4>
                </div>

                <div class="flex-1 p-4 overflow-y-auto space-y-3" id="chatMessages">
                    <div class="text-center text-gray-400 text-xs py-4">جاري تحميل الرسائل...</div>
                </div>

                <form id="chatForm" onsubmit="sendChatMessage(event)" class="p-3 border-t border-slate-800 flex items-center gap-2 bg-slate-950/60">
                    <input type="text" id="chatInput" placeholder="اكتب رسالتك..." required class="flex-1 bg-slate-900 border border-slate-700 focus:border-purple-500 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none">
                    <button type="submit" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-bold rounded-xl">إرسال</button>
                </form>
            </div>
        </div>
    </div>


    <!-- ==================== PART 4: PROFILE VIEW ==================== -->
    <div id="profileSection" class="relative z-10 hidden min-h-screen pb-20">
        <div class="max-w-3xl mx-auto px-4 pt-4">
            <div class="glass-card rounded-3xl overflow-hidden border border-slate-800 p-6 text-center space-y-3 shadow-2xl">
                <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center text-3xl font-black text-white userAvatarContainer">
                    <span class="userAvatarLetter">S</span>
                </div>
                <h2 class="text-xl font-bold text-white" id="profileName">مستخدم Sovexa</h2>
                <p class="text-xs text-indigo-300 font-mono" id="profileEmail">user@sovexa.com</p>
                <button onclick="logout()" class="px-4 py-2 bg-red-600/20 border border-red-500/30 text-red-300 text-xs font-semibold rounded-xl transition-all hover:bg-red-600 hover:text-white">
                    تسجيل الخروج
                </button>
            </div>
        </div>
    </div>


    <!-- ==================== FIREBASE SCRIPT ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut,
            GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
            RecaptchaVerifier, signInWithPhoneNumber
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCJm_0O6NzS0UYnoYAv5MUIp-QR9xGN18Q",
          authDomain: "sovexa-fbc93.firebaseapp.com",
          projectId: "sovexa-fbc93",
          storageBucket: "sovexa-fbc93.firebasestorage.app",
          messagingSenderId: "147264654219",
          appId: "1:147264654219:web:7487b91cc6c5fa041efd8e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedImageFile = null;

        window.showToast = (msg) => {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'glass-modal px-4 py-2.5 rounded-2xl border border-indigo-500/50 shadow-2xl text-xs font-bold text-white flex items-center gap-2';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        window.handleImageSelection = (e) => {
            const file = e.target.files[0];
            if (file) selectedImageFile = file;
        };

        // ---------- Auth State Listener ----------
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const loginSection = document.getElementById('loginSection');
            const mainHeader = document.getElementById('mainHeader');
            const feedSection = document.getElementById('feedSection');

            if (user) {
                if (loginSection) loginSection.classList.add('hidden');
                if (mainHeader) mainHeader.classList.remove('hidden');
                if (feedSection) feedSection.classList.remove('hidden');

                const displayName = (user.email || user.phoneNumber || "مستخدم").split('@')[0];
                document.querySelectorAll('.userAvatarLetter').forEach(el => el.innerText = displayName.charAt(0).toUpperCase());
                const profileName = document.getElementById('profileName');
                if (profileName) profileName.innerText = displayName;
                const profileEmail = document.getElementById('profileEmail');
                if (profileEmail) profileEmail.innerText = user.email || user.phoneNumber || "";

                listenToRealtimePosts();
                listenToRealtimeChat();
            } else {
                if (loginSection) loginSection.classList.remove('hidden');
                if (mainHeader) mainHeader.classList.add('hidden');
                if (feedSection) feedSection.classList.add('hidden');
            }
        });

        // Handle result when returning from Google redirect (fallback)
        getRedirectResult(auth).catch((err) => {
            if (err && err.message) alert("خطأ Google: " + err.message);
        });

        // ---------- Google Login ----------
        const googleProvider = new GoogleAuthProvider();
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                showToast("جاري تسجيل الدخول بجوجل... 🔄");
                await signInWithPopup(auth, googleProvider);
                showToast("مرحباً بك في Sovexa! 🎉");
            } catch (err) {
                if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
                    await signInWithRedirect(auth, googleProvider);
                } else if (err.code !== 'auth/popup-closed-by-user') {
                    alert("خطأ Google: " + err.message);
                }
            }
        });

        // ---------- Phone Login ----------
        const togglePhoneBtn = document.getElementById('togglePhoneBtn');
        const phonePanel = document.getElementById('phonePanel');
        const phoneStep = document.getElementById('phoneStep');
        const codeStep = document.getElementById('codeStep');
        let confirmationResult = null;

        const recaptcha = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });

        togglePhoneBtn.addEventListener('click', () => {
            phonePanel.classList.toggle('hidden');
        });

        document.getElementById('sendCodeBtn').addEventListener('click', async () => {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!/^\+\d{8,15}$/.test(phone)) {
                showToast("أدخل الرقم بصيغة دولية مثل +966500000000");
                return;
            }
            try {
                showToast("جاري إرسال الرمز... 🔄");
                confirmationResult = await signInWithPhoneNumber(auth, phone, recaptcha);
                phoneStep.classList.add('hidden');
                codeStep.classList.remove('hidden');
                showToast("تم إرسال الرمز إلى هاتفك 📩");
            } catch (err) {
                recaptcha.clear();
                alert("خطأ الهاتف: " + err.message);
            }
        });

        document.getElementById('verifyCodeBtn').addEventListener('click', async () => {
            const code = document.getElementById('codeInput').value.trim();
            if (!confirmationResult) return;
            try {
                await confirmationResult.confirm(code);
                showToast("مرحباً بك في Sovexa! 🎉");
            } catch (err) {
                alert("رمز غير صحيح: " + err.message);
            }
        });

        document.getElementById('backToPhoneBtn').addEventListener('click', () => {
            codeStep.classList.add('hidden');
            phoneStep.classList.remove('hidden');
            confirmationResult = null;
        });

        // ---------- Email Login (unchanged) ----------
        const emailForm = document.getElementById('emailForm');
        if (emailForm) {
            emailForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('emailInput').value.trim();
                const password = document.getElementById('passwordInput').value.trim();

                if (!email || !password) {
                    showToast("يرجى إدخال البريد وكلمة المرور!");
                    return;
                }

                try {
                    showToast("جاري تسجيل الدخول... 🔄");
                    await signInWithEmailAndPassword(auth, email, password);
                    showToast("مرحباً بك مجدداً في Sovexa! 🎉");
                } catch (loginError) {
                    try {
                        showToast("جاري إنشاء حساب جديد... 🚀");
                        await createUserWithEmailAndPassword(auth, email, password);
                        showToast("تم إنشاء حسابك وتسجيل الدخول بنجاح! ✨");
                    } catch (createError) {
                        alert("خطأ في المصادقة: " + createError.message);
                    }
                }
            });
        }

        window.logout = async () => {
            await signOut(auth);
            showToast("تم تسجيل الخروج.");
        };

        window.showSection = (sectionName) => {
            ['feedSection', 'chatSection', 'profileSection'].forEach(sec => {
                const el = document.getElementById(sec);
                if (el) el.classList.add('hidden');
            });
            const target = document.getElementById(sectionName + 'Section');
            if (target) target.classList.remove('hidden');
        };

        window.createNewPost = async () => {
            const textInput = document.getElementById('postInput');
            const postText = textInput.value.trim();
            if (!postText) {
                showToast("يرجى كتابة شيء لنشره!");
                return;
            }
            try {
                await addDoc(collection(db, "posts"), {
                    userId: currentUser.uid,
                    userName: (currentUser.email || currentUser.phoneNumber || "مستخدم").split('@')[0],
                    text: postText,
                    createdAt: serverTimestamp(),
                    likesCount: 0
                });
                textInput.value = '';
                showToast("تم نشر منشورك بنجاح! 🎉");
            } catch (err) {
                alert("خطأ في النشر: " + err.message);
            }
        };

        function listenToRealtimePosts() {
            const postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            onSnapshot(postsQuery, (snapshot) => {
                const postsContainer = document.getElementById('postsContainer');
                postsContainer.innerHTML = '';
                if (snapshot.empty) {
                    postsContainer.innerHTML = '<div class="glass-card p-6 rounded-2xl text-center text-xs text-gray-400">لا توجد منشورات بعد.</div>';
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const card = document.createElement('article');
                    card.className = 'glass-card p-4 rounded-2xl border border-slate-800 space-y-2';
                    card.innerHTML = `
                        <h4 class="font-bold text-xs text-white">${post.userName}</h4>
                        <p class="text-xs text-gray-200">${post.text}</p>
                    `;
                    postsContainer.appendChild(card);
                });
            });
        }

        function listenToRealtimeChat() {
            const chatQuery = query(collection(db, "global_chat"), orderBy("createdAt", "asc"));
            onSnapshot(chatQuery, (snapshot) => {
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                if (snapshot.empty) {
                    chatMessages.innerHTML = '<div class="text-center text-gray-400 text-xs py-4">لا توجد رسائل بعد.</div>';
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = currentUser && msg.userId === currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                    div.innerHTML = `<div class="max-w-[80%] p-3 rounded-2xl text-xs ${isMe ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-gray-200'}"><b>${msg.userName}:</b> ${msg.text}</div>`;
                    chatMessages.appendChild(div);
                });
            });
        }

        window.sendChatMessage = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            try {
                await addDoc(collection(db, "global_chat"), {
                    userId: currentUser.uid,
                    userName: (currentUser.email || currentUser.phoneNumber || "مستخدم").split('@')[0],
                    text: text,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch (err) {
                console.error(err);
            }
        };
    </script>
</body>
