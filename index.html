  .bubble-other { background:#1f2937; color:#e5e7eb; border-radius:1.1rem 1.1rem 1.1rem 0.3rem; }

<body class="min-h-screen">

<!-- ============ LOGIN ============ -->
<div id="loginSection" class="min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md card rounded-3xl p-6 shadow-2xl">
    <div class="text-center mb-5">
      <div class="mx-auto w-20 h-20 rounded-3xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center mb-3">
        <span class="font-black text-4xl text-white" style="font-family:Outfit">S</span>

      <h2 class="text-xl font-bold text-white" data-i18n="welcomeTitle">مرحباً بك في Sovexa</h2>

    <button id="googleLoginBtn" class="w-full py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm font-medium flex items-center justify-center gap-3 mb-3">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.3s.7 2.6 1.9 5l3.7-2.5z"/>
        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
      </svg>
      <span data-i18n="googleLogin">متابعة باستخدام Google</span>

    <button id="togglePhoneBtn" class="w-full py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm font-medium flex items-center justify-center gap-3 mb-3">
      <i class="fa-solid fa-phone text-emerald-400"></i> <span data-i18n="phoneLogin">متابعة برقم الهاتف</span>
    </button>

    <div id="phonePanel" class="hidden space-y-3 mb-3">
      <div id="phoneStep">
        <input type="tel" id="phoneInput" placeholder="+966500000000" dir="ltr" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm outline-none">
        <button id="sendCodeBtn" type="button" class="w-full mt-2 py-2.5 bg-emerald-600 rounded-xl text-sm font-bold" data-i18n="sendCode">إرسال رمز التحقق</button>

      <div id="codeStep" class="hidden">
        <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="123456" dir="ltr" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-center tracking-widest outline-none">
        <button id="verifyCodeBtn" type="button" class="w-full mt-2 py-2.5 bg-emerald-600 rounded-xl text-sm font-bold" data-i18n="verifyCode">تأكيد الرمز</button>

      <input type="email" id="emailInput" required placeholder="البريد الإلكتروني" data-i18n-placeholder="emailPlaceholder" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm outline-none">
      <input type="password" id="passwordInput" required placeholder="كلمة المرور" data-i18n-placeholder="passPlaceholder" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm outline-none">
      <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-pink-600 rounded-xl text-sm font-bold" data-i18n="loginBtn">تسجيل الدخول / إنشاء حساب</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut,
  RecaptchaVerifier, signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot,
  query, orderBy, limit, serverTimestamp, arrayUnion, arrayRemove, increment
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const BUILD = "BUILD 2";

const translations = {
  ar: {
    welcomeTitle: "مرحباً بك في Sovexa",
    welcomeSub: "سجل الدخول للمتابعة",
    googleLogin: "متابعة باستخدام Google",
    phoneLogin: "متابعة برقم الهاتف",
    sendCode: "إرسال رمز التحقق",
    verifyCode: "تأكيد الرمز",
    changePhone: "تغيير الرقم",
    orEmail: "أو بالبريد",
    emailPlaceholder: "البريد الإلكتروني",
    passPlaceholder: "كلمة المرور",
    loginBtn: "تسجيل الدخول / إنشاء حساب",
    settingsTitle: "الإعدادات",
    registeredAccount: "الحساب المسجّل",
    editProfile: "تعديل الملف الشخصي",
    privacy: "الخصوصية",
    notifications: "الإشعارات",
    language: "اللغة",
    langArabic: "العربية",
    logout: "تسجيل الخروج",
    soonMsg: "هذه الميزة ستتوفر قريباً!"
  },
  en: {
    welcomeTitle: "Welcome to Sovexa",
    welcomeSub: "Sign in to continue",
    googleLogin: "Continue with Google",
    phoneLogin: "Continue with Phone",
    sendCode: "Send Verification Code",
    verifyCode: "Verify Code",
    changePhone: "Change Phone Number",
    orEmail: "Or via Email",
    emailPlaceholder: "Email Address",
    passPlaceholder: "Password",
    loginBtn: "Sign In / Register",
    settingsTitle: "Settings",
    registeredAccount: "Registered Account",
    editProfile: "Edit Profile",
    privacy: "Privacy",
    notifications: "Notifications",
    language: "Language",
    langArabic: "Arabic",
    logout: "Log Out",
    soonMsg: "This feature is coming soon!"
  }
};

let currentLang = localStorage.getItem("sovexa_lang") || "ar";

function applyLanguage() {
  const t = translations[currentLang];
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
  
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (t[key]) el.textContent = t[key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (t[key]) el.placeholder = t[key];
  });
  const langLbl = document.getElementById("langLabel");
  if (langLbl) langLbl.textContent = currentLang === "ar" ? "العربية" : "English";
}

const app = initializeApp({
  apiKey: "AIzaSyCJm_0O6NzS0UYnoYAv5MUIp-QR9xGN18Q",
  authDomain: "sovexa-fbc93.firebaseapp.com",
  projectId: "sovexa-fbc93",
  storageBucket: "sovexa-fbc93.firebasestorage.app",
  messagingSenderId: "147264654219",
  appId: "1:147264654219:web:7487b91cc6c5fa041efd8e"
});
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "shanks377s8@gmail.com";
const SUB_PRICE = "9.99$ شهرياً";
const isVerified = (u) => !!u && (u.email === ADMIN_EMAIL || u.verified === true);
const badgeHTML = (on) => on ? ' <i class="fa-solid fa-circle-check text-indigo-400 text-xs"></i>' : '';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nameOf = (u) => u.name || u.displayName || (u.email ? u.email.split("@")[0] : "") || u.phoneNumber || "مستخدم";
const uid = () => currentUser?.uid;
const me = () => allUsers[uid()] || { uid: uid(), name: "", email: currentUser?.email || "" };
const V = () => $('view');
const chatIdFor = (a, b) => [a, b].sort().join("_");
const handleOf = (u) => u.username ? "@" + u.username : "";

let currentUser = null, currentView = "home", currentId = null;
let allUsers = {}, usersByUsername = {}, postsCache = {};
let usersUnsub = null, postsUnsub = null, savedUnsub = null;
let unsubs = [], commentUnsubs = {}, openSet = new Set();
let confirmationResult = null, recaptcha = null;
let pendingPhoto = null, pendingCover = null, pendingPostImg = null;
let profileTarget = null;
let savedIds = new Set();

window.showToast = (msg) => {
  const box = document.createElement('div');
  box.className = 'card px-4 py-2 rounded-xl text-xs font-bold text-white shadow-xl';
  box.textContent = msg;
  $('toastContainer').appendChild(box);
  setTimeout(() => box.remove(), 2800);
};
const showToast = window.showToast;

function avatarHTML(name, photo, cls = 'w-10 h-10 text-sm') {
  return photo
    ? `<img src="${esc(photo)}" class="${cls} rounded-full object-cover shrink-0">`
    : `<div class="${cls} rounded-full bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center font-bold text-white shrink-0">${esc((name || "?").charAt(0).toUpperCase())}</div>`;
}

function timeAgo(ts) {
  if (!ts) return "الآن";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString(currentLang === 'ar' ? 'ar' : 'en', { dateStyle: 'medium', timeStyle: 'short' });
}

function followBtn(id) {
  const f = (me().following || []).includes(id);
  const t = currentLang === 'ar' ? (f ? 'إلغاء المتابعة' : 'متابعة') : (f ? 'Unfollow' : 'Follow');
  return `<button data-act="follow" data-id="${id}" class="px-3 py-1.5 rounded-lg text-xs font-bold ${f ? 'bg-gray-700 text-gray-200' : 'bg-indigo-600 text-white'}">${t}</button>`;
}

function backHeader(title) {
  return `
    <div class="flex items-center gap-3">
      <button data-go="menu" class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center"><i class="fa-solid fa-arrow-right"></i></button>
      <h2 class="font-bold text-lg">${title}</h2>
    </div>`;
}

function clearListeners() {
  unsubs.forEach(f => f());
  unsubs = [];
  Object.values(commentUnsubs).forEach(f => f && f());
  commentUnsubs = {};
  openSet.clear();
}

function setActiveTab(view) {
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('tab-on', b.dataset.tab === view));
}

function go(view, id) {
  clearListeners();
  currentView = view;
  currentId = id || null;
  setActiveTab(view);
  const views = {
    home: viewHome, notifications: viewNotifications, chats: viewChats, chat: viewChat,
    profile: viewProfile, edit: viewEdit, search: viewSearch, friends: viewFriends,
    create: viewCreate, reels: viewReels, menu: viewMenu, settings: viewSettings,
    help: viewHelp, about: viewAbout, saved: viewSaved, archive: viewArchive
  };
  (views[view] || viewHome)(id);
  window.scrollTo(0, 0);
}

function actionsHTML(p) {
  const likes = p.likes || [];
  const liked = likes.includes(uid());
  const saved = savedIds.has(p.id);
  const tLike = currentLang === 'ar' ? 'إعجاب' : 'Like';
  const tComment = currentLang === 'ar' ? 'تعليق' : 'Comment';
  const tSave = currentLang === 'ar' ? 'حفظ' : 'Save';
  const tShare = currentLang === 'ar' ? 'مشاركة' : 'Share';
  return `
  <div class="flex justify-around items-center border-t border-gray-800 text-sm text-gray-400 py-1">
    <button data-act="like" data-id="${p.id}" class="flex-1 py-2 flex items-center justify-center gap-1.5 ${liked ? 'text-pink-400 font-bold' : ''}">
      <i class="fa-${liked ? 'solid' : 'regular'} fa-heart"></i><span>${tLike}</span><span class="text-xs">${likes.length}</span>
    </button>
    <button data-act="comments" data-id="${p.id}" class="flex-1 py-2 flex items-center justify-center gap-1.5">
      <i class="fa-regular fa-comment"></i><span>${tComment}</span><span class="text-xs">${p.commentsCount || 0}</span>
    </button>
    <button data-act="save" data-id="${p.id}" class="flex-1 py-2 flex items-center justify-center gap-1.5 ${saved ? 'text-amber-400' : ''}">
      <i class="fa-${saved ? 'solid' : 'regular'} fa-bookmark"></i><span>${tSave}</span>
    </button>
    <button data-act="share" data-id="${p.id}" class="flex-1 py-2 flex items-center justify-center gap-1.5">
      <i class="fa-solid fa-share"></i><span>${tShare}</span>
    </button>
  </div>`;
}

function postCard(p) {
  return `
  <article class="card rounded-xl overflow-hidden">
    <div class="flex items-center gap-3 p-3">
      ${avatarHTML(p.userName, p.userPhoto)}
      <div class="flex-1 min-w-0">
        <b class="block text-sm text-white truncate">${esc(p.userName)}${badgeHTML(p.verified)}</b>
        <span class="text-xs text-gray-500">${timeAgo(p.createdAt)}</span>
      </div>
      ${p.userId === uid() ? `<button data-act="delpost" data-id="${p.id}" class="text-gray-500 px-2"><i class="fa-solid fa-trash"></i></button>` : ''}
    </div>
    ${p.text ? `<p class="px-3 pb-3 text-sm whitespace-pre-wrap">${esc(p.text)}</p>` : ''}
    ${p.image ? `<img src="${esc(p.image)}" class="w-full max-h-[480px] object-cover">` : ''}
    ${actionsHTML(p)}
    <div id="cbox-${p.id}" class="hidden p-3 border-t border-gray-800 space-y-2"></div>
  </article>`;
}

function renderPosts(containerId, filter, emptyMsg) {
  const box = $(containerId);
  if (!box) return;
  const list = Object.entries(postsCache)
    .map(([id, p]) => ({ id, ...p }))
    .filter(filter || (() => true))
    .sort((a, b) => (b.createdAt?.seconds ?? Date.now() / 1000) - (a.createdAt?.seconds ?? Date.now() / 1000));
  box.innerHTML = list.length
    ? list.map(postCard).join('')
    : `<p class="text-center text-gray-500 py-10">${emptyMsg || (currentLang === 'ar' ? 'لا توجد منشورات بعد' : 'No posts yet')}</p>`;
  restoreOpenComments();
}

function refreshPosts() {
  renderPosts('feed', null);
  if (profileTarget) renderPosts('uposts', p => p.userId === profileTarget, currentLang === 'ar' ? 'لا توجد منشورات' : 'No posts');
}

async function toggleLike(id) {
  const p = postsCache[id];
  if (!p) return;
  const old = [...(p.likes || [])];
  const liked = old.includes(uid());
  p.likes = liked ? old.filter(x => x !== uid()) : [...old, uid()];
  refreshPosts();
  try {
    await updateDoc(doc(db, "posts", id), { likes: liked ? arrayRemove(uid()) : arrayUnion(uid()) });
  } catch (err) {
    p.likes = old;
    refreshPosts();
    showToast("تعذر تسجيل الإعجاب");
  }
}

async function toggleSave(id) {
  const ref = doc(db, "users", uid(), "saved", id);
  if (savedIds.has(id)) {
    savedIds.delete(id);
    refreshPosts();
    await deleteDoc(ref);
    showToast(currentLang === 'ar' ? 'أُزيل من المحفوظات' : 'Removed from saved');
  } else {
    savedIds.add(id);
    refreshPosts();
    await setDoc(ref, { postId: id, savedAt: serverTimestamp() });
    showToast(currentLang === 'ar' ? 'تم الحفظ 🔖' : 'Saved 🔖');
  }
}

function watchComments(id) {
  commentUnsubs[id] && commentUnsubs[id]();
  $('cbox-' + id)?.classList.remove('hidden');
  const q = query(collection(db, "posts", id, "comments"), orderBy("createdAt", "asc"), limit(50));
  commentUnsubs[id] = onSnapshot(q, (snap) => {
    const box = $('cbox-' + id);
    if (!box) return;
    const placeholder = currentLang === 'ar' ? 'اكتب تعليقاً...' : 'Write a comment...';
    const sendTxt = currentLang === 'ar' ? 'إرسال' : 'Send';
    box.innerHTML = snap.docs.map(d => {
      const c = d.data();
      return `<div class="flex gap-2">${avatarHTML(c.userName, c.userPhoto, 'w-7 h-7 text-xs')}
        <div class="bg-gray-800 rounded-xl px-3 py-2 text-xs"><b>${esc(c.userName)}${badgeHTML(c.verified)}</b><p>${esc(c.text)}</p></div></div>`;
    }).join('') + `
      <form data-form="comment" data-id="${id}" class="flex gap-2 pt-1">
        <input name="t" autocomplete="off" placeholder="${placeholder}" class="flex-1 bg-gray-800 rounded-full px-3 py-2 text-xs outline-none">
        <button class="text-indigo-400 text-xs font-bold px-2">${sendTxt}</button>
      </form>`;
  });
}

function openComments(id) {
  if (openSet.has(id)) {
    openSet.delete(id);
    commentUnsubs[id] && commentUnsubs[id]();
    delete commentUnsubs[id];
    $('cbox-' + id)?.classList.add('hidden');
    return;
  }
  openSet.add(id);
  watchComments(id);
}

function restoreOpenComments() {
  openSet.forEach(id => { if ($('cbox-' + id)) watchComments(id); });
}

function viewHome() {
  const placeholder = currentLang === 'ar' ? `بماذا تفكر يا ${nameOf(me())}؟` : `What's on your mind, ${nameOf(me())}?`;
  V().innerHTML = `
    <div class="p-3 space-y-3 max-w-xl mx-auto">
      <section class="card rounded-xl p-3 flex items-center gap-3">
        ${avatarHTML(nameOf(me()), me().photoURL)}
        <button data-go="create" class="flex-1 text-right bg-gray-800 rounded-full px-4 py-2 text-sm text-gray-400">${placeholder}</button>
      </section>
      <div id="feed" class="space-y-3"></div>
    </div>`;
  refreshPosts();
}

function viewNotifications() {
  const list = Object.entries(postsCache)
    .map(([id, p]) => ({ id, ...p }))
    .filter(p => p.userId !== uid())
    .sort((a, b) => (b.createdAt?.seconds ?? 0) - (a.createdAt?.seconds ?? 0))
    .slice(0, 30);
  const title = currentLang === 'ar' ? 'الإشعارات' : 'Notifications';
  const empty = currentLang === 'ar' ? 'لا توجد إشعارات بعد' : 'No notifications yet';
  V().innerHTML = `
    <div class="p-3 space-y-2 max-w-xl mx-auto">
      <h2 class="font-bold text-lg mb-2">${title}</h2>
      ${list.length ? list.map(p => `
        <div class="card rounded-xl p-3 flex items-center gap-3">
          ${avatarHTML(p.userName, p.userPhoto, 'w-9 h-9 text-xs')}
