<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovexa - تسجيل الدخول</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f17;
            color: #f3f4f6;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .outfit-font {
            font-family: 'Outfit', sans-serif;
        }
        /* Fullscreen Canvas Background */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Glassmorphism Panel */
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        /* Glowing Text Effect */
        .glow-text {
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.6), 0 0 40px rgba(236, 72, 153, 0.4);
        }
        .glow-letter {
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.8), 0 0 60px rgba(236, 72, 153, 0.6);
        }
    </style>
</head>
<body class="relative flex flex-col justify-between items-center min-h-screen select-none overflow-hidden">

    <!-- Fullscreen Interactive Animated Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Overlay Tint for Depth -->
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/40 via-transparent to-slate-950/80 z-0 pointer-events-none"></div>

    <!-- Top Header / Bar -->
    <header class="relative z-10 w-full p-4 sm:p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-xs font-semibold tracking-wider text-gray-300 uppercase outfit-font">Sovexa Network</span>
        </div>
        <button onclick="toggleLoginForm()" class="px-3.5 py-1.5 text-xs font-medium bg-white/10 hover:bg-white/20 text-white rounded-full backdrop-blur-md border border-white/10 transition-all flex items-center gap-2">
            <i class="fa-solid fa-eye" id="toggleIcon"></i>
            <span id="toggleBtnText">إخفاء النموذج</span>
        </button>
    </header>

    <!-- Center Content: Logo Box + Login Form -->
    <main class="relative z-10 flex flex-col items-center justify-center my-auto px-4 w-full max-w-md">
        
        <!-- Center Icon S Container -->
        <div class="mb-4 sm:mb-6 flex flex-col items-center group cursor-pointer" onclick="toggleLoginForm()">
            <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-3xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 p-[2px] shadow-2xl shadow-indigo-500/50 transition-all duration-500 transform group-hover:scale-105 group-hover:rotate-1">
                <div class="w-full h-full rounded-[22px] bg-slate-950/80 backdrop-blur-xl flex items-center justify-center border border-white/20">
                    <span class="outfit-font font-black text-5xl sm:text-6xl text-transparent bg-clip-text bg-gradient-to-tr from-indigo-400 via-pink-400 to-purple-300 glow-letter">
                        S
                    </span>
                </div>
            </div>
        </div>

        <!-- Glass Login Form Box -->
        <div id="loginCard" class="w-full glass-card p-5 sm:p-7 rounded-3xl transition-all duration-500 transform opacity-100 scale-100 max-h-[80vh] overflow-y-auto">
            <div class="text-center mb-5">
                <h2 class="text-xl sm:text-2xl font-bold text-white mb-1">مرحباً بك في Sovexa</h2>
                <p class="text-xs text-gray-300">اختر طريقة تسجيل الدخول المفضل لديك</p>
            </div>

            <!-- Quick Social & Phone Login Buttons -->
            <div class="space-y-2.5 mb-5">
                <!-- Google Login Button -->
                <button onclick="alert('جارٍ تفعيل الدخول بحساب Google عبر Firebase...');" class="w-full py-2.5 px-4 bg-slate-900/90 hover:bg-slate-800 border border-gray-700 hover:border-gray-500 text-white font-medium text-xs rounded-xl transition-all flex items-center justify-center gap-3 group shadow-md">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.3s.7 2.6 1.9 5l3.7-2.5z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
                    </svg>
                    <span>تسجيل الدخول عبر Google</span>
                </button>

                <!-- Phone Login Button -->
                <button onclick="switchTab('phone')" class="w-full py-2.5 px-4 bg-slate-900/90 hover:bg-slate-800 border border-gray-700 hover:border-indigo-500 text-white font-medium text-xs rounded-xl transition-all flex items-center justify-center gap-3 text-indigo-300">
                    <i class="fa-solid fa-mobile-screen-button text-indigo-400 text-sm"></i>
                    <span>تسجيل الدخول برقم الهاتف</span>
                </button>
            </div>

            <!-- Separator Line -->
            <div class="relative flex py-2 items-center mb-4">
                <div class="flex-grow border-t border-gray-700/80"></div>
                <span class="flex-shrink mx-3 text-[11px] text-gray-400">أو بالبريد الإلكتروني</span>
                <div class="flex-grow border-t border-gray-700/80"></div>
            </div>

            <!-- Email Form Area -->
            <form id="emailForm" onsubmit="event.preventDefault(); alert('جارٍ التحقق من الحساب...');" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">البريد الإلكتروني</label>
                    <div class="relative">
                        <input type="email" required placeholder="name@sovexa.com" class="w-full bg-slate-900/90 border border-gray-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none transition-colors pr-9">
                        <i class="fa-solid fa-envelope absolute left-3 top-3 text-gray-400 text-xs"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">كلمة المرور</label>
                    <div class="relative">
                        <input type="password" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-gray-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none transition-colors pr-9">
                        <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400 text-xs"></i>
                    </div>
                </div>

                <div class="flex items-center justify-between text-[11px] text-gray-400">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" class="rounded bg-slate-800 border-gray-700 text-indigo-600 focus:ring-0">
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="text-indigo-400 hover:underline">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-500/30 transition-all transform active:scale-95">
                    متابعة بالبريد الإلكتروني
                </button>
            </form>

            <!-- Phone Form Area (Hidden by default) -->
            <form id="phoneForm" onsubmit="event.preventDefault(); alert('جارٍ إرسال رمز التحقق SMS...');" class="space-y-3 hidden">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">رقم الهاتف المحمول</label>
                    <div class="relative flex gap-2">
                        <input type="tel" required placeholder="+213 600 000 000" class="w-full bg-slate-900/90 border border-gray-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none transition-colors text-left dir-ltr">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-500/20 transition-all transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>إرسال رمز التحقق (SMS)</span>
                </button>

                <button type="button" onclick="switchTab('email')" class="w-full text-center text-[11px] text-gray-400 hover:text-white pt-1">
                    الرجوع للبريد الإلكتروني
                </button>
            </form>

            <div class="mt-5 pt-3 border-t border-gray-800/80 text-center">
                <p class="text-[11px] text-gray-400">
                    ليس لديك حساب؟ 
                    <a href="#" onclick="alert('سنتيح إنشاء الحساب فور ربط قاعدة البيانات!');" class="text-pink-400 font-semibold hover:underline">إنشاء حساب جديد</a>
                </p>
            </div>
        </div>

    </main>

    <!-- Bottom Brand Title Sovexa -->
    <footer class="relative z-10 w-full pb-6 pt-2 text-center">
        <h1 class="outfit-font font-black text-3xl sm:text-4xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-200 to-pink-300 glow-text uppercase">
            Sovexa
        </h1>
        <div class="w-2 h-2 rounded-full bg-indigo-500 mx-auto mt-2 shadow-lg shadow-indigo-500/80 animate-ping"></div>
    </footer>

    <!-- Background Animation Script -->
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.color = Math.random() > 0.5 ? '#6366f1' : '#ec4899';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animate() {
            const bgGradient = ctx.createLinearGradient(0, 0, width, height);
            bgGradient.addColorStop(0, '#0b0f17');
            bgGradient.addColorStop(0.5, '#1e1b4b');
            bgGradient.addColorStop(1, '#0f172a');

            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.shadowBlur = 100;
            ctx.shadowColor = '#4f46e5';
            ctx.fillStyle = 'rgba(79, 70, 229, 0.15)';
            ctx.beginPath();
            ctx.arc(width * 0.2, height * 0.3, 180, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = '#ec4899';
            ctx.fillStyle = 'rgba(236, 72, 153, 0.12)';
            ctx.beginPath();
            ctx.arc(width * 0.8, height * 0.7, 220, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Toggle Login Form
        let isFormVisible = true;
        function toggleLoginForm() {
            const card = document.getElementById('loginCard');
            const icon = document.getElementById('toggleIcon');
            const btnText = document.getElementById('toggleBtnText');
            
            isFormVisible = !isFormVisible;
            if (isFormVisible) {
                card.style.opacity = '1';
                card.style.transform = 'scale(1)';
                card.style.pointerEvents = 'auto';
                icon.className = 'fa-solid fa-eye';
                btnText.innerText = 'إخفاء النموذج';
            } else {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                card.style.pointerEvents = 'none';
                icon.className = 'fa-solid fa-eye-slash';
                btnText.innerText = 'إظهار النموذج';
            }
        }

        // Switch Tab between Email and Phone
        function switchTab(type) {
            const emailForm = document.getElementById('emailForm');
            const phoneForm = document.getElementById('phoneForm');

            if(type === 'phone') {
                emailForm.classList.add('hidden');
                phoneForm.classList.remove('hidden');
            } else {
                phoneForm.classList.add('hidden');
                emailForm.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
